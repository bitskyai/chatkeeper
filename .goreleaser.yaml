version: 2
project_name: chatkeeper
builds:
  - main: ./cmd/chatkeeper
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: 'chatkeeper_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: SHA256SUMS
sboms:
  - artifacts: archive
    documents:
      - '${artifact}.sbom.json'
release:
  github:
    owner: bitskyai
    name: chatkeeper
  prerelease: auto
changelog:
  sort: asc
# Homebrew formula for the CLI/server (macOS + Linux), published to
# bitskyai/homebrew-tap when the HOMEBREW_TAP_TOKEN secret is configured.
# `brews` is soft-deprecated upstream in favour of casks, but casks cannot
# declare a `brew services` daemon; keep the formula until that changes.
# The desktop app cask (chatkeeper-app) is generated by desktop/macos because
# GoReleaser OSS cannot build or reference DMGs.
brews:
  - name: chatkeeper
    repository:
      owner: bitskyai
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Formula
    homepage: https://github.com/bitskyai/chatkeeper
    description: Keep selected chat threads in a local, searchable, read-only archive
    license: MIT
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: 'chatkeeper {{ .Tag }}'
    install: |
      bin.install "chatkeeper"
    test: |
      assert_match "chatkeeper", shell_output("#{bin}/chatkeeper version")
    service: |
      run [opt_bin/"chatkeeper", "run", "--no-browser"]
      keep_alive true
      # stdout carries the per-launch login token; never write it to the
      # shared Homebrew log directory. stderr has no secrets.
      error_log_path var/"log/chatkeeper.log"
    caveats: |
      Start ChatKeeper and open its browser UI:
        chatkeeper run
      Or keep it running in the background (loopback only):
        brew services start chatkeeper
      then run `chatkeeper run` again to open the browser UI of the running instance.
      The menu-bar app is available as a cask: brew install --cask bitskyai/tap/chatkeeper-app
