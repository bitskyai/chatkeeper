version: 2
project_name: chatkeeper
builds:
  - main: ./cmd/chatkeeper
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
archives:
  - formats: [tar.gz]
    name_template: 'chatkeeper_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]
checksum:
  name_template: SHA256SUMS
sboms:
  - artifacts: archive
    documents:
      - '${artifact}.sbom.json'
release:
  github:
    owner: bitskyai
    name: chatkeeper
  prerelease: auto
changelog:
  sort: asc
# Homebrew: GoReleaser's `brews` (formulae) is deprecated and its replacement,
# `homebrew_casks`, cannot declare a `brew services` daemon. The release
# workflow renders Formula/chatkeeper.rb with scripts/make-formula.py from
# dist/SHA256SUMS instead; desktop/macos renders the chatkeeper-app cask.
