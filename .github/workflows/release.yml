name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.42.0
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.14.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/SHA256SUMS
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish Homebrew formula (stable tags only)
        env:
          TAG: ${{ github.ref_name }}
          # Optional: fine-grained PAT with contents:write on bitskyai/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$HOMEBREW_TAP_TOKEN" ] || { echo "HOMEBREW_TAP_TOKEN unset; formula not published"; exit 0; }
          formula="$RUNNER_TEMP/chatkeeper.rb"
          python3 scripts/make-formula.py --version "${TAG#v}" --sums dist/SHA256SUMS --out "$formula"
          ruby -c "$formula"
          scripts/publish-tap.sh Formula/chatkeeper.rb "$formula" "chatkeeper $TAG"
  container:
    needs: release
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Select image tags
        id: tags
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            echo 'stable=ghcr.io/bitskyai/chatkeeper:latest' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            COMMIT=${{ steps.tags.outputs.commit }}
            DATE=${{ steps.tags.outputs.date }}
          tags: |
            ghcr.io/bitskyai/chatkeeper:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.stable }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/bitskyai/chatkeeper
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
  download-smoke:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - {platform: linux, arch: amd64, extension: tar.gz, binary: chatkeeper}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download published archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir smoke
          gh release download "$RELEASE_TAG" --repo bitskyai/chatkeeper --pattern "chatkeeper_*_${PLATFORM}_${ARCH}.${EXTENSION}" --pattern SHA256SUMS --dir smoke
      - name: Verify, extract and launch
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          python - <<'PY'
          import hashlib, pathlib, tarfile, zipfile
          root = pathlib.Path('smoke')
          for line in (root / 'SHA256SUMS').read_text().splitlines():
              digest, name = line.split()
              archive = root / name.lstrip('*')
              if not archive.exists():
                  continue
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
              if archive.suffix == '.zip':
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(root)
              else:
                  with tarfile.open(archive) as t:
                      t.extractall(root, filter='data')
          PY
          python scripts/smoke-release.py "smoke/$BINARY"
